# ============================================================
# DAY 7 - DATABASE CONFIGURATION
# ============================================================


# MySQL database URL.
#
# localhost = MySQL is running on our computer.
#
# 3306 = default MySQL port.
#
# library_db = database name.
spring.datasource.url=jdbc:mysql://localhost:3306/library_db


# MySQL username.
spring.datasource.username=root


# MySQL password.
#
# IMPORTANT:
# Replace YOUR_PASSWORD with your actual MySQL password.
spring.datasource.password=root


# MySQL JDBC driver.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================


# Tells Hibernate to update the database schema
# according to our @Entity classes.
#
# Example:
#
# @Entity Book
#       ?
# Hibernate
#       ?
# books table
spring.jpa.hibernate.ddl-auto=update


# Display SQL generated by Hibernate
# in the IntelliJ console.
spring.jpa.show-sql=true


# Format the generated SQL so it is easier to read.
spring.jpa.properties.hibernate.format_sql=true




# Server port.
server.port=8080