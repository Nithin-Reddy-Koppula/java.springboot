# =====================================================
# APPLICATION
# =====================================================

spring.application.name=day-6-library

# Spring Boot application port
server.port=8080


# =====================================================
# MYSQL DATABASE
# =====================================================

# Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/library_db

# MySQL username
spring.datasource.username=root

# CHANGE THIS TO YOUR MYSQL PASSWORD
spring.datasource.password=root


# =====================================================
# JPA / HIBERNATE
# =====================================================

# Keep existing database tables.
#
# Hibernate will update the schema if required.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in IntelliJ console.
spring.jpa.show-sql=true

# Format SQL queries so they are easier to read.
spring.jpa.properties.hibernate.format_sql=true