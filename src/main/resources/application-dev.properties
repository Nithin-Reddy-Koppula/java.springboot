# ==========================================================
# DEVELOPMENT PROFILE
# ==========================================================

# Application name
spring.application.name=book-api-dev


# ==========================================================
# DATABASE
# ==========================================================

# MySQL database URL
spring.datasource.url=jdbc:mysql://localhost:3306/bookdb

# MySQL username
# IMPORTANT: Do NOT put ${root} here.
spring.datasource.username=root

# MySQL password
# Replace YOUR_MYSQL_PASSWORD with your actual MySQL password.
spring.datasource.password=root

# MySQL JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================================
# JPA / HIBERNATE
# ==========================================================

# Automatically create/update tables based on entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries so they are easier to read
spring.jpa.properties.hibernate.format_sql=true


# ==========================================================
# LOGGING
# ==========================================================

# Show DEBUG logs for our Day_9 package
logging.level.Day_9=DEBUG

# Spring Web logs
logging.level.org.springframework.web=INFO